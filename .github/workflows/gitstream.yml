name: gitStream

on:
  pull_request:

jobs:
  gitstream:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Run GitStream
        uses: linear-b/gitstream-github-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
