name: gitstream

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitstream:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: linear-b/gitstream-github-action@v2
        with:
          full_repository: ${{ github.repository }}
          head_ref: ${{ github.head_ref }}
          base_ref: ${{ github.base_ref }}
